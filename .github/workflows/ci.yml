name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, xml, curl
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax lint
        run: find app bootstrap config database public routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: next-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
