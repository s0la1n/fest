map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name igrovoy-labirint.ru www.igrovoy-labirint.ru;
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://igrovoy-labirint.ru$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name www.igrovoy-labirint.ru;
  ssl_certificate /etc/letsencrypt/live/igrovoy-labirint.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/igrovoy-labirint.ru/privkey.pem;
  return 301 https://igrovoy-labirint.ru$request_uri;
}

server {
  listen 443 ssl http2;
  server_name igrovoy-labirint.ru;
  ssl_certificate /etc/letsencrypt/live/igrovoy-labirint.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/igrovoy-labirint.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ^~ /storage/ {
    alias /var/www/storage/;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }

  location ~ ^/(api(?:/|$)|sanctum(?:/|$)) {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTPS on;
    fastcgi_pass backend:9000;
    fastcgi_read_timeout 60s;
  }

  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
