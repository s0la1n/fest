services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./laravel-backend/storage/app/public:/var/www/storage:ro
    networks: [web, internal]

  frontend:
    build:
      context: ./next-frontend
    restart: unless-stopped
    expose: ["3000"]
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks: [web]

  backend:
    build:
      context: ./laravel-backend
    restart: unless-stopped
    env_file:
      - ./laravel-backend/.env
    expose: ["9000"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./laravel-backend/.env:/var/www/html/.env
      - ./laravel-backend/storage/app/public:/var/www/html/storage/app/public
      - backend-storage:/var/www/html/storage/framework
      - backend-logs:/var/www/html/storage/logs
    networks: [web, internal]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in root .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in root .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in root .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in root .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

  certbot:
    image: certbot/certbot:v3.2.0
    profiles: ["tools"]
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt

volumes:
  mysql-data:
  backend-storage:
  backend-logs:

networks:
  web:
  internal:
    internal: true
